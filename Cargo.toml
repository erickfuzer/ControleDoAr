[package]
name = "controle-do-ar"
version = "2.0.0"
description = "Controle remoto de ar-condicionado Samsung (SmartThings) na bandeja do Windows"
authors = ["Erick Cassol Fuzer"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[[bin]]
name = "ControleDoAr"
path = "src/main.rs"

[dependencies]
# Interface nativa: só o renderizador por software (sem GPU nem WebView), bandeja do próprio Slint.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "system-tray",
    "unstable-winit-030",
] }
ab_glyph = "0.2.32"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
